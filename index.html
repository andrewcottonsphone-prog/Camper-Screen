<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08090a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Camper Screen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="remote">

    <h1 class="title">CAMPER SCREEN</h1>

    <section class="controls" aria-label="Screen controls">

      <button id="btn-up" class="btn" type="button" aria-label="Screen up">
        <span class="glyph">&#9650;</span>
        <span class="label">UP</span>
      </button>

      <button id="btn-down" class="btn" type="button" aria-label="Screen down">
        <span class="glyph">&#9660;</span>
        <span class="label">DOWN</span>
      </button>

    </section>

    <button id="connect" class="connect" type="button">Tap to connect</button>

  </main>

  <script src="app.js" defer></script>
</body>
</html>
